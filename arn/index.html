<!DOCTYPE html>
<html lang="ko" data-lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="스테이 아른(강남) 게스트용 이용안내 — 체크인, 와이파이, 집 사용법, 회의실, 괄사, 택시·밴, 음식 배달, 맛집, 자주 묻는 질문">
<title>스테이 아른 이용안내 · Stay ARN</title>
<style>

  :root {
    --accent: #14675A;
    --tint: #E4EFEC;
    --ink: #222222;
    --muted: #6B6B6B;
    --line: #ECE6DC;
    --soft: #F7F3EC;
    --gold: #B9A679;
    --shadow: 0 2px 10px rgba(0, 0, 0, 0.05);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { -webkit-text-size-adjust: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: #FFFFFF;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
    font-size: 17px;
    line-height: 1.6;
    word-break: keep-all;
    overflow-wrap: break-word;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
  a { color: inherit; }
  .stage, .tile, .quick, .band, .toc-row, .tab, .row, .btn, .back-btn { text-decoration: none; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #app {
    position: relative;
    max-width: 480px;
    margin: 0 auto;
    padding: 0 20px calc(96px + env(safe-area-inset-bottom, 0px));
  }
  .muted { color: var(--muted); }

  /* 첫 화면 */
  .hero { position: relative; margin: 0 -20px; aspect-ratio: 4 / 3.6; overflow: hidden; background: var(--soft); }
  .hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hero::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 58%; background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(255,255,255,0.55) 45%, rgba(255,255,255,0.92) 80%, #FFFFFF 100%); pointer-events: none; }
  .home-head { position: relative; z-index: 1; padding: 28px 0 4px; }
  .hero + .home-head { margin-top: -120px; padding-top: 0; }
  .live-clock { font-variant-numeric: tabular-nums; }
  .time-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 14px; }
  .time-row .date-line { margin: 0; }
  .weather { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin: 12px 0 0; padding: 10px 14px; border-radius: 14px; background: var(--soft); border: 1px solid var(--line); }
  .w-icon { flex-shrink: 0; display: inline-flex; width: 32px; height: 32px; color: var(--accent); }
  .w-icon svg { width: 32px; height: 32px; }
  .w-text { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; flex: 1; min-width: 0; }
  .w-top { display: inline-flex; align-items: baseline; gap: 8px; }
  .w-cond { font-size: 16px; font-weight: 700; }
  .w-temp { font-size: 22px; font-weight: 800; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .w-range { display: inline-flex; gap: 10px; font-size: 16px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .w-tip { flex-basis: 100%; font-size: 16px; font-weight: 600; color: var(--accent); }
  .wchip { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .wchip svg { width: 20px; height: 20px; color: var(--accent); }
  .wchip-label { color: var(--muted); }
  .wchip-temp { font-weight: 700; font-variant-numeric: tabular-nums; }
  .stage { flex-direction: row !important; align-items: center; justify-content: flex-start !important; gap: 16px; }
  .stage-icon { flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; width: 60px; height: 60px; border-radius: 14px; background: var(--soft); color: var(--ink); }
  .stage-icon svg { width: 32px; height: 32px; }
  .stage-text { display: flex; flex-direction: column; flex: 1; min-width: 0; }
  .stage-go { flex-shrink: 0; color: var(--muted); }
  .stage-go svg { width: 24px; height: 24px; display: block; }
  .tagline { margin: 0; font-size: 16px; color: var(--accent); font-weight: 700; letter-spacing: 0.02em; }
  .stay-name { margin: 4px 0 0; font-size: 40px; line-height: 1.1; font-weight: 800; letter-spacing: -0.03em; }
  .slogan { white-space: pre-line; margin: 18px 0 0; font-size: 24px; line-height: 1.35; font-weight: 700; letter-spacing: -0.02em; }
  .date-line { margin: 14px 0 0; font-size: 16px; color: var(--muted); }
  .section-title { margin: 36px 0 14px; font-size: 21px; font-weight: 700; line-height: 1.3; }
  .stage {
    display: flex; flex-direction: column; justify-content: center;
    width: 100%; min-height: 104px; margin-bottom: 12px; padding: 18px 20px;
    background: #FFFFFF; border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
  }
  .stage-title { font-size: 21px; font-weight: 700; line-height: 1.3; }
  .stage-sub { margin-top: 4px; font-size: 16px; color: var(--muted); }
  .stage:active, .tile:active, .quick:active, .toc-row:active { border-color: var(--accent); }
  .fact { background: var(--soft); border-radius: 14px; padding: 12px 8px; text-align: center; }
  .fact-label { display: block; font-size: 16px; color: var(--muted); }
  .fact-value { display: block; font-size: 16px; font-weight: 700; }
  .foot { margin-top: 40px; text-align: center; font-size: 16px; color: var(--muted); }

  /* 상단 */
  .topbar { display: flex; align-items: center; min-height: 56px; padding-top: 8px; }
  .back-btn {
    display: inline-flex; align-items: center; min-height: 48px; padding: 0 16px; margin-left: -4px;
    border: 1px solid var(--line); border-radius: 8px; font-size: 16px; font-weight: 600; background: #FFFFFF;
  }
  .page-title { margin: 16px 0 0; font-size: 30px; line-height: 1.25; font-weight: 800; letter-spacing: -0.02em; }
  .page-sub { margin: 8px 0 24px; font-size: 17px; color: var(--muted); }

  /* 숙소 홈 */
  .greet { margin: 16px 0 0; font-size: 28px; line-height: 1.25; font-weight: 800; letter-spacing: -0.02em; }
  .ticket {
    margin-top: 22px; padding: 20px; border-radius: 14px; background: var(--soft);
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 8px;
  }
  .tk-col:last-child { text-align: right; }
  .tk-label { display: block; font-size: 16px; color: var(--muted); }
  .tk-day { display: block; font-size: 17px; font-weight: 700; min-height: 1.4em; }
  .tk-time { display: block; font-size: 32px; font-weight: 800; color: var(--accent); line-height: 1.15; letter-spacing: -0.02em; }
  .tk-mid { text-align: center; padding-bottom: 6px; }
  .tk-mid .tk-label { font-size: 16px; }
  .tk-nights { display: block; font-size: 18px; font-weight: 700; }
  .quick-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .quick.wide { grid-column: 1 / -1; flex-direction: row; align-items: center; justify-content: space-between; min-height: 72px; padding: 12px 16px; text-align: left; }
  .quick-left { display: flex; flex-direction: column; }
  .quick.wide .quick-copy { flex-shrink: 0; padding: 8px 14px; border-radius: 8px; background: var(--accent); color: #FFFFFF; font-size: 16px; font-weight: 700; }
  .quick {
    display: flex; flex-direction: column; justify-content: center; min-height: 92px; padding: 12px 10px;
    border: 1px solid var(--line); border-radius: 14px; background: #FFFFFF; box-shadow: var(--shadow); text-align: center;
  }
  .quick-title { font-size: 16px; color: var(--muted); }
  .quick-value { font-size: 16px; font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; word-break: break-all; }
  .tile-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tile {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 96px; padding: 12px 6px;
    border: 1px solid var(--line); border-radius: 14px; background: #FFFFFF; box-shadow: var(--shadow); text-align: center;
  }
  .tile-icon { display: inline-flex; width: 28px; height: 28px; color: var(--accent); }
  .tile-icon svg { width: 28px; height: 28px; }
  .tile-title { font-size: 16px; font-weight: 700; line-height: 1.3; }
  .tile-sub { margin-top: 4px; font-size: 16px; color: var(--muted); line-height: 1.4; }
  .band {
    position: relative; display: flex; flex-direction: column; justify-content: flex-end;
    width: 100%; min-height: 132px; margin-bottom: 12px; padding: 18px 20px; overflow: hidden;
    border-radius: 14px; background-color: var(--ink); background-size: cover; background-position: center; color: #FFFFFF;
  }
  .band::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.62), rgba(0,0,0,0.05) 75%); }
  .band > span { position: relative; z-index: 1; }
  .band-title { font-size: 21px; font-weight: 800; line-height: 1.3; }
  .band-sub { font-size: 16px; opacity: 0.92; }

  /* 블록 */
  .block { margin-bottom: 16px; }
  .text p { margin: 0 0 12px; font-size: 17px; }
  .note { padding: 16px 18px; border-radius: 14px; background: var(--soft); border: 1px solid var(--line); }
  .note.accent { border-left: 4px solid var(--accent); }
  .note-title { margin: 0; font-size: 17px; font-weight: 700; }
  .note-text { margin: 4px 0 0; font-size: 16px; color: #4A4A4A; }
  .steps { list-style: none; margin: 0; padding: 0; }
  .step { display: grid; grid-template-columns: 32px 1fr; gap: 12px; padding: 10px 0; }
  .step-num {
    display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px;
    border-radius: 50%; background: var(--accent); color: #FFFFFF; font-size: 16px; font-weight: 700;
  }
  .step-title { margin: 3px 0 0; font-size: 17px; font-weight: 700; line-height: 1.4; }
  .step-text { white-space: pre-line; margin: 2px 0 0; font-size: 16px; color: var(--muted); }
  .photos { display: grid; gap: 8px; }
  .photos.two { grid-template-columns: 1fr 1fr; }
  .photo { margin: 0; border-radius: 14px; overflow: hidden; background: var(--soft); }
  .photo img { display: block; width: 100%; max-width: 100%; height: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
  .photos.zoom .photo img { aspect-ratio: auto; object-fit: contain; background: #FFFFFF; }
  .photos.full .photo { background: #FFFFFF; border: 1px solid var(--line); }
  .photos.full .photo img { aspect-ratio: auto; height: auto; max-height: 520px; object-fit: contain; }
  .zoom-hint { margin: 6px 0 0; font-size: 16px; color: var(--muted); }
  .facts { border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
  .fact-line { display: grid; grid-template-columns: 96px 1fr; }
  .fact-line + .fact-line { border-top: 1px solid var(--line); }
  .fact-k { padding: 14px 12px; background: var(--soft); font-size: 16px; font-weight: 700; color: var(--muted); }
  .fact-v { padding: 14px 14px; font-size: 16px; }
  .fact-v small { display: block; font-size: 16px; color: var(--muted); }
  .sub-heading { margin: 32px 0 4px; font-size: 21px; font-weight: 700; line-height: 1.3; }
  .sub-heading-sub { margin: 0 0 12px; font-size: 16px; color: var(--muted); }
  .card { padding: 20px; border-radius: 14px; border: 1px solid var(--line); background: #FFFFFF; box-shadow: var(--shadow); }
  .card-label { margin: 0 0 6px; font-size: 16px; font-weight: 700; color: var(--muted); }
  .big-value { margin: 0; font-size: 22px; font-weight: 700; line-height: 1.35; overflow-wrap: break-word; }
  .card-small { margin: 4px 0 0; font-size: 16px; color: var(--muted); }
  .card + .card { margin-top: 12px; }

  /* 버튼 */
  .btn {
    display: flex; align-items: center; justify-content: center; width: 100%; min-height: 52px; margin-top: 12px; padding: 12px 16px;
    border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #FFFFFF;
    font-size: 17px; font-weight: 700; text-decoration: none; text-align: center;
  }
  .btn.outline { background: #FFFFFF; color: var(--accent); }
  .btn-icon { display: inline-flex; width: 20px; height: 20px; margin-right: 8px; }
  .btn-icon svg { width: 20px; height: 20px; }
  .msg-note { margin: 14px 0 0; font-size: 16px; }
  .hostcard { padding: 20px; border-radius: 18px; background: #1E1E1E; color: #FFFFFF; }
  .hc-name { margin: 0; font-size: 18px; font-weight: 800; }
  .hc-small { margin: 2px 0 0; font-size: 16px; color: rgba(255,255,255,0.72); }
  .hc-num { margin: 14px 0 2px; font-size: 26px; font-weight: 800; letter-spacing: 0.01em; font-variant-numeric: tabular-nums; }
  .hostcard .btn { margin-top: 12px; }
  .btn.hc-call { background: transparent; border-color: rgba(255,255,255,0.4); color: #FFFFFF; }
  .nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .num { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 88px; padding: 10px 6px; border: 1px solid var(--line); border-radius: 14px; background: var(--soft); text-align: center; text-decoration: none; }
  .num-big { font-size: 22px; font-weight: 800; color: var(--accent); line-height: 1.2; }
  .num-label { margin-top: 2px; font-size: 16px; color: var(--muted); line-height: 1.3; }
  .btn.plain { background: #FFFFFF; color: var(--ink); border-color: var(--line); }
  .btn.uber { background: #FFFFFF; color: var(--ink); border-color: var(--ink); margin-top: 10px; }
  .points { list-style: none; margin: 0; padding: 0; }
  .points li { position: relative; padding: 8px 0 8px 22px; font-size: 17px; border-bottom: 1px solid var(--line); }
  .points li:last-child { border-bottom: 0; }
  .points li::before { content: ""; position: absolute; left: 4px; top: 18px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn-row .btn { margin-top: 0; }

  /* 맛집 카드 */
  .spot { padding: 0 0 18px; border-radius: 14px; border: 1px solid var(--line); background: #FFFFFF; box-shadow: var(--shadow); overflow: hidden; }
  .spot + .spot { margin-top: 14px; }
  .spot .photo { border-radius: 0; }
  .spot .photo img { aspect-ratio: 16 / 10; }
  .spot .photo.full img { aspect-ratio: auto; height: auto; max-height: 520px; object-fit: contain; background: var(--soft); }
  .spot .mosaic { height: 200px; }
  .spot-body { padding: 16px 18px 0; }
  .spot-name { margin: 0; font-size: 20px; font-weight: 800; line-height: 1.3; }
  .spot-desc { margin: 2px 0 10px; font-size: 16px; color: var(--muted); }
  .meta { margin: 0; font-size: 16px; }
  .meta b { font-weight: 600; color: var(--muted); margin-right: 6px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; padding: 0; list-style: none; }
  .tag { padding: 4px 12px; border-radius: 999px; background: var(--tint); color: var(--accent); font-size: 16px; font-weight: 600; }
  .reason { margin: 12px 0 0; padding-top: 12px; border-top: 1px dashed var(--line); font-size: 16px; }
  .reason b { margin-right: 6px; }
  .spot .btn { margin: 14px 18px 0; width: calc(100% - 36px); }

  /* 체험 카드 */
  .xp { padding: 0 0 18px; border-radius: 14px; border: 1px solid var(--line); background: #FFFFFF; box-shadow: var(--shadow); overflow: hidden; }
  .xp + .xp { margin-top: 14px; }
  .mosaic { display: grid; gap: 3px; height: 230px; background: var(--line); }
  .mosaic.n1 { grid-template-columns: 1fr; }
  .mosaic.n2 { grid-template-columns: 1fr 1fr; }
  .mosaic.n3 { grid-template-columns: 1.7fr 1fr; grid-template-rows: 1fr 1fr; }
  .mosaic.n3 .mosaic-cell:first-child { grid-row: 1 / span 2; }
  .mosaic-cell { display: block; border: 0; padding: 0; margin: 0; min-height: 0; overflow: hidden; cursor: zoom-in; background: var(--soft); }
  .mosaic-cell img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .xp-body { padding: 16px 18px 0; }
  .xp-cat { margin: 0; font-size: 16px; font-weight: 800; letter-spacing: 0.06em; color: var(--gold); }
  .xp-title { margin: 4px 0 6px; font-size: 20px; font-weight: 800; line-height: 1.35; }
  .xp-sub { margin: 0; font-size: 16px; color: var(--muted); line-height: 1.5; }
  .xp-meta { margin: 8px 0 0; font-size: 16px; font-weight: 600; }
  .xp .btn { margin: 14px 18px 0; width: calc(100% - 36px); }

  /* 서울 인기 체험 10선 (사진 없는 카드 + 필터) */
  .xf { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 2px 16px 12px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .xf::-webkit-scrollbar { display: none; }
  .xf-btn { flex-shrink: 0; min-height: 48px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line); background: #FFFFFF; color: var(--ink); font: inherit; font-size: 16px; font-weight: 700; white-space: nowrap; cursor: pointer; }
  .xf-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #FFFFFF; }
  .xf-count { margin: 0 0 12px; font-size: 16px; color: var(--muted); }
  .xc { padding: 18px 18px 18px; border-radius: 14px; border: 1px solid var(--line); background: #FFFFFF; box-shadow: var(--shadow); }
  .xc + .xc { margin-top: 14px; }
  .xc.has-photo { padding-top: 0; overflow: hidden; }
  .xc-photo { display: block; width: calc(100% + 36px); height: 210px; margin: 0 -18px 16px; padding: 0; border: 0; background: var(--soft); cursor: zoom-in; }
  .xc-photo img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .xc[hidden] { display: none; }
  .xc-head { display: flex; align-items: center; gap: 10px; }
  .xc-ic { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; width: 44px; height: 44px; border-radius: 12px; background: var(--tint); color: var(--accent); }
  .xc-ic svg { width: 24px; height: 24px; }
  .xc-cat { margin: 0; font-size: 16px; font-weight: 800; color: var(--gold); }
  .xc-title { margin: 12px 0 6px; font-size: 20px; font-weight: 800; line-height: 1.35; }
  .xc-desc { margin: 0; font-size: 16px; color: #4A4A4A; line-height: 1.55; }
  .xc-meta { margin: 10px 0 0; font-size: 16px; font-weight: 700; }
  .xc-meta .star { color: var(--accent); margin-right: 4px; }
  .xc-meta .dot { color: var(--muted); font-weight: 400; margin: 0 6px; }
  .xc-note { display: flex; gap: 8px; margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--soft); font-size: 16px; line-height: 1.5; }
  .xc-note svg { flex-shrink: 0; width: 20px; height: 20px; margin-top: 2px; color: var(--accent); }
  .xc-note b { margin-right: 6px; }
  .xc .btn { margin-top: 14px; width: 100%; }
  .xf-empty { margin: 0; padding: 18px; border-radius: 14px; border: 1px dashed var(--line); font-size: 16px; color: var(--muted); text-align: center; }

  /* 한 줄 목록 */
  .rows { border-radius: 14px; border: 1px solid var(--line); overflow: hidden; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 64px; padding: 12px 16px; text-decoration: none; background: #FFFFFF; }
  .row + .row { border-top: 1px solid var(--line); }
  .row-name { display: block; font-size: 17px; font-weight: 700; line-height: 1.35; }
  .row-desc { display: block; font-size: 16px; color: var(--muted); }
  .row-side { flex-shrink: 0; font-size: 16px; color: var(--muted); }
  a.row .row-side { font-size: 22px; font-weight: 800; color: var(--accent); }

  /* 코스 */
  .stop { position: relative; padding: 0 0 18px 44px; }
  .stop::before { content: ""; position: absolute; left: 15px; top: 34px; bottom: 0; width: 2px; background: var(--line); }
  .stop:last-child::before { display: none; }
  .stop-num {
    position: absolute; left: 0; top: 0; display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--gold); color: var(--ink); background: #FFFFFF; font-size: 16px; font-weight: 700;
  }
  .stop-name { margin: 2px 0 4px; font-size: 19px; font-weight: 700; line-height: 1.35; }
  .stop-text { margin: 0 0 10px; font-size: 16px; color: #4A4A4A; }
  .stop .photo { margin-bottom: 10px; }
  .stop-photos .photo { margin-bottom: 0; }
  .stop-photos { margin-bottom: 10px; }
  .stop .meta { color: var(--muted); }

  /* 그림 */
  .art + .art { margin-top: 28px; }
  .art-room { display: inline-block; padding: 2px 12px; border-radius: 999px; background: var(--soft); color: var(--gold); font-size: 16px; font-weight: 700; }
  .art-title { margin: 8px 0 0; font-size: 20px; font-weight: 800; }
  .art-en { margin: 0 0 10px; font-size: 16px; font-style: italic; color: var(--muted); }

  function sEsc(t) { return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function sSnip(lines, toks) {
    var line = null;

      var low = lines[i].toLowerCase();

    }
    if (!line) { return ""; }
    var h = sEsc(line);
    toks.forEach(function (t) { h = h.replace(new RegExp("(" + sEsc(t).replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi"), "<mark>$1</mark>"); });
    return h;
  }
