<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>mobile preview (temporary)</title>
<style>html,body{margin:0;background:#fff}iframe{display:block;width:390px;border:0;height:2400px}</style>
</head>
<body>
<iframe id="f" src="./?lang=ko"></iframe>
<script>
document.getElementById('f').addEventListener('load', function(){
  try { var h = this.contentDocument.documentElement.scrollHeight; this.style.height = h + 'px'; } catch(e) {}
});
</script>
</body>
</html>
